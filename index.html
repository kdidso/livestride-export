<!DOCTYPE html>
<html>
<head>
  <title>LiveStride – Find My Run</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    body { font-family: Arial, sans-serif; padding: 20px; }
    table { border-collapse: collapse; width: 100%; margin-top: 20px; }
    th, td { border: 1px solid #ccc; padding: 8px; text-align: left; }
    th { background-color: #f0f0f0; }
    .stale { background-color: #ffe5e5; }
    button { padding: 4px 10px; margin-right: 6px; }
    #searchInput {
      padding: 8px;
      font-size: 16px;
      width: 250px;
    }
    #status {
      margin-top: 12px;
      font-weight: bold;
    }
  </style>
</head>

<body>

<h2>Find My Run</h2>

<input type="text" id="searchInput" placeholder="Search your name or run ID">

<p>Runs with a stop time older than 30 minutes are highlighted.</p>

<div id="status"></div>

<table id="runnerTable">
  <thead>
    <tr>
      <th>Run ID</th>
      <th>Name</th>
      <th>Start Time</th>
      <th>Stop Time</th>
      <th>Minutes Ago</th>
      <th>Actions</th>
    </tr>
  </thead>
  <tbody></tbody>
</table>

<script>
  const SUPABASE_URL = "https://liczyibicdyvlpfiwyhc.supabase.co";
  const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImxpY3p5aWJpY2R5dmxwZml3eWhjIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzc0MDc5MTgsImV4cCI6MjA5Mjk4MzkxOH0.A3EV_DV9kGR5F0iKAzq8f1ZewETDMkfbN0p8hCit0rQ";

  const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  const RUNS_TABLE = "runs";
  const POINTS_TABLE = "run_points_native_test";
  const POINT_BATCH_SIZE = 1000;
  const ELEVATION_LOOKUP_URL = "https://elevation.livestride.run/api/v1/lookup";

  let allRuns = [];

  function setStatus(message) {
    document.getElementById("status").textContent = message || "";
  }

  function escapeXml(value) {
    return String(value ?? "")
      .replaceAll("&", "&amp;")
      .replaceAll("<", "&lt;")
      .replaceAll(">", "&gt;")
      .replaceAll('"', "&quot;")
      .replaceAll("'", "&apos;");
  }

  function formatDateTime(value) {
    if (!value) return "N/A";
    return new Date(value).toLocaleString();
  }

  function minutesSince(value) {
    if (!value) return "";
    return Math.floor((Date.now() - new Date(value).getTime()) / 60000);
  }

async function loadRuns() {
  setStatus("Loading finished runs...");

  const { data, error } = await supabaseClient
    .from(RUNS_TABLE)
    .select("id, runner_name, started_at, finished_at, is_live, total_distance_m, latest_lat, latest_lon")
    .not("finished_at", "is", null)
    .order("finished_at", { ascending: false });

if (error) {
  console.error("Supabase runs error:", error);
  setStatus(`Failed to load runs: ${error.message}`);
  return;
}

  allRuns = (data || []).map(run => {
    const minsAgo = minutesSince(run.finished_at);

    return {
      id: run.id,
      runner_name: run.runner_name || "",
      started_at: run.started_at || null,
      finished_at: run.finished_at || null,
      is_live: run.is_live,
      total_distance_m: run.total_distance_m,
      latest_lat: run.latest_lat,
      latest_lon: run.latest_lon,
      minutesAgo: minsAgo,
      isStale: minsAgo > 30
    };
  });

  renderTable(allRuns);
  setStatus(`Loaded ${allRuns.length} finished runs.`);
}

  function renderTable(runs) {
    const tableBody = document.querySelector("#runnerTable tbody");
    tableBody.innerHTML = "";

    runs.forEach(run => {
      const row = document.createElement("tr");
      if (run.isStale) row.classList.add("stale");

      const safeRun = encodeURIComponent(JSON.stringify(run));

      row.innerHTML = `
        <td>${escapeXml(run.id)}</td>
        <td>${escapeXml(run.runner_name)}</td>
        <td>${formatDateTime(run.started_at)}</td>
        <td>${formatDateTime(run.finished_at)}</td>
        <td>${run.finished_at ? run.minutesAgo : "N/A"}</td>
        <td>
          <button onclick="downloadGPXFromSupabase('${safeRun}')">Convert to GPX</button>
          <button onclick="uploadToStrava()">Upload to Strava</button>
        </td>
      `;

      tableBody.appendChild(row);
    });
  }

function refreshMinutesAgoColumn() {
  allRuns = allRuns.map(run => {
    const minsAgo = run.finished_at ? minutesSince(run.finished_at) : "";

    return {
      ...run,
      minutesAgo: minsAgo,
      isStale: run.finished_at ? minsAgo > 30 : false
    };
  });

  const query = document.getElementById("searchInput").value.toLowerCase();

  const filtered = allRuns.filter(run =>
    String(run.runner_name || "").toLowerCase().includes(query) ||
    String(run.id || "").toLowerCase().includes(query)
  );

  renderTable(filtered);
}

async function fetchAllNativePoints(run) {
  let allPoints = [];
  let from = 0;

  while (true) {
    const to = from + POINT_BATCH_SIZE - 1;

    const { data, error } = await supabaseClient
      .from(POINTS_TABLE)
      .select("*")
      .eq("run_id", run.id)
      .eq("runner_name", run.runner_name)
      .order("sequence_num", { ascending: true })
      .range(from, to);

    if (error) {
      console.error(error);
      throw new Error("Failed to fetch run points from Supabase.");
    }

    const batch = data || [];
    allPoints = allPoints.concat(batch);

    if (batch.length < POINT_BATCH_SIZE) break;

    from += POINT_BATCH_SIZE;
  }

  return allPoints;
}

  function getPointLat(pt) {
    return pt.lat ?? pt.latitude;
  }

  function getPointLon(pt) {
    return pt.lon ?? pt.lng ?? pt.longitude;
  }

function getExistingPointElevationMeters(pt) {
  if (pt.elevation_m != null) return Number(pt.elevation_m);
  if (pt.elevation != null) return Number(pt.elevation);
  if (pt.elevationFt != null) return Number(pt.elevationFt) / 3.28084;
  if (pt.elevation_ft != null) return Number(pt.elevation_ft) / 3.28084;
  return null;
}

async function fetchElevationMeters(lat, lon) {
  const url = `${ELEVATION_LOOKUP_URL}?locations=${lat},${lon}`;

  const response = await fetch(url);
  if (!response.ok) {
    throw new Error(`Elevation lookup failed: ${response.status}`);
  }

  const json = await response.json();
  const elevation = json?.results?.[0]?.elevation;

  if (elevation == null || Number.isNaN(Number(elevation))) {
    throw new Error("Elevation server did not return a usable elevation.");
  }

  return Number(elevation);
}

  function getPointTime(pt, fallbackTime) {
    return (
      pt.recorded_at ||
      pt.timestamp ||
      pt.created_at ||
      pt.time ||
      fallbackTime ||
      new Date().toISOString()
    );
  }

  async function downloadGPXFromSupabase(encodedRun) {
    const run = JSON.parse(decodeURIComponent(encodedRun));

    try {
      setStatus(`Fetching native points for ${run.runner_name || run.id}...`);

      const points = await fetchAllNativePoints(run);

      if (!points || points.length === 0) {
        alert("No native Supabase points found for this run.");
        setStatus("");
        return;
      }

      const validPoints = points.filter(pt => {
        const lat = getPointLat(pt);
        const lon = getPointLon(pt);
        return lat != null && lon != null;
      });

      if (validPoints.length === 0) {
        alert("Points were found, but none had usable latitude/longitude values.");
        setStatus("");
        return;
      }

      const startDate = run.started_at || validPoints[0].recorded_at || validPoints[0].created_at || new Date().toISOString();
      const dateStr = new Date(startDate).toISOString().slice(0, 10);

      const trackName = run.runner_name
        ? `${run.runner_name} – ${dateStr}`
        : `LiveStride Run ${dateStr}`;

      let gpx = `<?xml version="1.0" encoding="UTF-8"?>\n`;
      gpx += `<gpx creator="LiveStride" version="1.1" xmlns="http://www.topografix.com/GPX/1/1">\n`;
      gpx += `<trk>\n`;
      gpx += `<name>${escapeXml(trackName)}</name>\n`;
      gpx += `<trkseg>\n`;

for (let i = 0; i < validPoints.length; i++) {
  const pt = validPoints[i];

  const lat = getPointLat(pt);
  const lon = getPointLon(pt);

  let ele = getExistingPointElevationMeters(pt);

  const time = getPointTime(pt, run.started_at);

  if (ele == null) {
    setStatus(`Fetching missing elevation ${i + 1} of ${validPoints.length}...`);

    try {
      ele = await fetchElevationMeters(lat, lon);
    } catch (err) {
      console.error("Elevation fetch failed:", err);

      // omit <ele> if lookup fails
      ele = null;
    }
  }

  gpx += `  <trkpt lat="${lat}" lon="${lon}">\n`;

  if (ele != null) {
    gpx += `    <ele>${ele}</ele>\n`;
  }

  gpx += `    <time>${new Date(time).toISOString()}</time>\n`;
  gpx += `  </trkpt>\n`;
}

// THESE MUST BE AFTER THE LOOP
gpx += `</trkseg>\n`;
gpx += `</trk>\n`;
gpx += `</gpx>`;

      const blob = new Blob([gpx], { type: "application/gpx+xml" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");

      const safeName = (run.runner_name || "LiveStride")
        .replace(/[^a-z0-9_-]+/gi, "_")
        .replace(/^_+|_+$/g, "");

      a.href = url;
      a.download = `${safeName}_${dateStr}.gpx`;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);

      setStatus(`Downloaded GPX with ${validPoints.length} points.`);
    } catch (err) {
      console.error(err);
      alert(err.message || "Failed to create GPX file.");
      setStatus("Failed to create GPX file.");
    }
  }

  function uploadToStrava() {
    window.open("https://www.strava.com/upload/select", "_blank");
  }

  document.getElementById("searchInput").addEventListener("input", () => {
    const query = document.getElementById("searchInput").value.toLowerCase();

    const filtered = allRuns.filter(run =>
      String(run.runner_name || "").toLowerCase().includes(query) ||
      String(run.id || "").toLowerCase().includes(query)
    );

    renderTable(filtered);
  });

  loadRuns();
  setInterval(refreshMinutesAgoColumn, 60000);
</script>

</body>
</html>
